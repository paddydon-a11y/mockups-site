<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@700;800&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-family:'Barlow',sans-serif}
.logo{display:inline-flex;align-items:center;gap:22px;padding:10px}
.tile{width:150px;height:150px;background:#ffcd11;position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.tile b{font-family:'Saira Extra Condensed';font-weight:800;font-size:132px;line-height:1;color:#0d0d0d;letter-spacing:-.02em;margin-top:-16px}
.tile i{position:absolute;left:0;right:0;bottom:0;height:18px;background:repeating-linear-gradient(-45deg,#0d0d0d 0 13px,#ffcd11 13px 26px)}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font-family:'Saira Extra Condensed';font-weight:800;font-size:148px;letter-spacing:.005em;color:#0d0d0d;text-transform:uppercase;line-height:.86}
.word span{font-weight:700;font-size:34.5px;letter-spacing:.43em;color:#0d0d0d;text-transform:uppercase;margin-top:12px;margin-left:4px}
.white .word b,.white .word span{color:#fff}
.mark .tile{width:512px;height:512px}
.mark .tile b{font-size:450px;margin-top:-54px}
.mark .tile i{height:62px;background:repeating-linear-gradient(-45deg,#0d0d0d 0 44px,#ffcd11 44px 88px)}
</style></head><body>
<div class="logo" id="black"><div class="tile"><b>BF</b><i></i></div><div class="word"><b>Brian Fox</b><span>Construction</span></div></div><br>
<div class="logo white" id="white"><div class="tile"><b>BF</b><i></i></div><div class="word"><b>Brian Fox</b><span>Construction</span></div></div><br>
<div class="logo mark" id="mark" style="padding:0"><div class="tile"><b>BF</b><i></i></div></div>
</body></html>
